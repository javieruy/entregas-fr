<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Le Tour du Monde</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0b3c5d,#0f5a73 55%,#1b7a8c);color:#fff;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(28px,6vw,44px);margin:6px 0 8px;letter-spacing:-.5px}h1 span{color:#ffd23f}
.lema{color:#cfe8ef;font-size:17px;line-height:1.45;margin:0 0 20px}
.btn{display:inline-block;border:0;border-radius:999px;background:linear-gradient(90deg,#ff7a1a,#ff4f2e);color:#fff;font-weight:800;font-size:18px;padding:15px 28px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn.gris{background:#ffffff22;box-shadow:none}.tarjeta .btn.gris{background:#e9edf3;color:#1b2a4a}
.pas{background:#fff;color:#1b2a4a;border-radius:18px;padding:16px;margin:0 0 18px}
.pas h2{margin:0 0 10px;font-size:18px}.sellos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sello{aspect-ratio:1;border-radius:50%;border:2.5px dashed #c8cfdc;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.35}
.sello.ok{opacity:1;border-style:solid;transform:rotate(-8deg)}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cont{border:0;border-radius:16px;padding:18px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.22)}
.cont b{font-size:38px}.cont small{font-weight:600;opacity:.9}
.tarjeta{background:#fff;color:#1b2a4a;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cat{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.num{float:right;color:#8a93a5;font-size:13px;font-weight:700}
.q{font-size:21px;font-weight:800;line-height:1.3;margin:6px 0 16px}
.ops{display:grid;gap:10px}.op{border:2px solid #e2e6ee;background:#f7f9fc;border-radius:14px;padding:14px;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:#1b2a4a}
.op.bien{background:#dff6e5;border-color:#2fa84f}.op.mal{background:#fde2e0;border-color:#e0453a}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff6e1;font-size:16px;line-height:1.4;display:none}
.fb b{display:block;margin-bottom:4px}.acc{margin-top:16px;text-align:right}
.res{text-align:center}.res .big{font-size:64px}.oculto{display:none}
@media (max-width:520px){.mapa{grid-template-columns:repeat(2,1fr)}.sellos{grid-template-columns:repeat(6,1fr);gap:5px}.sello{font-size:20px}}
</style></head><body><div class="app" id="app"></div>
<script>
const D={"ui": {"titulo": "Le Tour du Monde", "lema": "Vole de continent en continent, réponds aux questions et remplis ton passeport de tampons.", "jugar": "Commencer le voyage", "pasaporte": "Mon passeport", "elige": "Choisis ta prochaine destination", "pregunta": "Question {n} sur {t}", "correcto": "Bravo !", "incorrecto": "Presque. La bonne réponse est :", "siguiente": "Suivant", "sello": "Tampon gagné !", "sello_falta": "Il faut {n} bonnes réponses sur {t} pour gagner le tampon. Refais ce continent !", "reintentar": "Réessayer", "volver": "Retour à la carte", "puntos": "{n} / {t} bonnes réponses", "final_titulo": "Grand voyageur !", "final_texto": "Tu as gagné les 6 tampons. Ton passeport est plein : tu connais le monde !", "reiniciar": "Recommencer un voyage", "categorias": {"capitales": "Pays et capitales", "idiomas": "Langues du monde", "agua": "Fleuves et océans", "montes": "Montagnes", "monumentos": "Monuments célèbres", "cultura": "Culture et curiosités"}}, "aprobar": 6, "continentes": [{"id": "europa", "nombre": "Europe", "emoji": "🏰", "color": "#2E6FB7", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale de l'Italie ?", "ops": ["Milan", "Rome", "Venise", "Naples"], "ok": 1, "dato": "Rome était le centre de l'Empire romain il y a plus de 2 000 ans."}, {"cat": "capitales", "q": "Quel pays a Madrid pour capitale ?", "ops": ["Le Portugal", "Le Mexique", "L'Espagne", "L'Argentine"], "ok": 2, "dato": "Madrid se trouve au centre de l'Espagne."}, {"cat": "idiomas", "q": "Quelle langue parle-t-on en Autriche ?", "ops": ["L'allemand", "Le français", "L'autrichien", "L'italien"], "ok": 0, "dato": "On parle allemand en Allemagne, en Autriche et dans une partie de la Suisse."}, {"cat": "agua", "q": "Quel long fleuve traverse Vienne, Budapest et Belgrade ?", "ops": ["Le Rhin", "La Seine", "La Tamise", "Le Danube"], "ok": 3, "dato": "Le Danube traverse ou longe 10 pays avant d'arriver dans la mer Noire."}, {"cat": "montes", "q": "Quelle est la plus haute chaîne de montagnes d'Europe de l'Ouest ?", "ops": ["Les Alpes", "Les Pyrénées", "Les Carpates", "L'Oural"], "ok": 0, "dato": "Le mont Blanc, dans les Alpes, mesure environ 4 800 mètres."}, {"cat": "monumentos", "q": "Dans quelle ville se trouve le Colisée ?", "ops": ["Athènes", "Paris", "Rome", "Londres"], "ok": 2, "dato": "Le Colisée a ouvert il y a presque 2 000 ans et pouvait accueillir environ 50 000 personnes."}, {"cat": "monumentos", "q": "Quelle tour célèbre a été construite à Paris en 1889 ?", "ops": ["La tour penchée", "La tour Eiffel", "Big Ben", "La tour CN"], "ok": 1, "dato": "La tour Eiffel mesure environ 330 mètres."}, {"cat": "cultura", "q": "Quelle mer se trouve entre l'Europe et l'Afrique ?", "ops": ["La mer Baltique", "La mer du Nord", "La mer Méditerranée", "La mer Rouge"], "ok": 2, "dato": "Son nom veut dire « la mer au milieu des terres »."}]}, {"id": "asia", "nombre": "Asie", "emoji": "🏯", "color": "#C4532E", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale du Japon ?", "ops": ["Tokyo", "Kyoto", "Osaka", "Séoul"], "ok": 0, "dato": "Tokyo est l'une des plus grandes villes du monde."}, {"cat": "capitales", "q": "Quel pays a New Delhi pour capitale ?", "ops": ["Le Pakistan", "L'Inde", "Le Népal", "Le Bangladesh"], "ok": 1, "dato": "L'Inde est le pays le plus peuplé du monde."}, {"cat": "idiomas", "q": "Quelle langue a le plus de locuteurs natifs au monde ?", "ops": ["L'anglais", "L'espagnol", "L'hindi", "Le chinois mandarin"], "ok": 3, "dato": "Près d'un milliard de personnes ont le chinois mandarin comme langue maternelle."}, {"cat": "agua", "q": "Quel est le plus long fleuve d'Asie ?", "ops": ["Le Gange", "Le Mékong", "Le Yangzi Jiang", "L'Indus"], "ok": 2, "dato": "Le Yangzi Jiang coule sur environ 6 300 kilomètres en Chine."}, {"cat": "montes", "q": "Quelle chaîne de montagnes a le plus haut sommet de la Terre ?", "ops": ["L'Himalaya", "Les Andes", "Les Alpes", "Les Rocheuses"], "ok": 0, "dato": "Le mont Everest mesure environ 8 850 mètres."}, {"cat": "monumentos", "q": "Quel long mur a été construit pour protéger la Chine des attaques ?", "ops": ["Le mur d'Hadrien", "La Grande Muraille", "Le mur de Berlin", "Le mur des Lamentations"], "ok": 1, "dato": "Mises bout à bout, ses sections mesurent des milliers de kilomètres."}, {"cat": "monumentos", "q": "Dans quel pays se trouve le Taj Mahal ?", "ops": ["L'Iran", "La Turquie", "L'Inde", "L'Égypte"], "ok": 2, "dato": "C'est un tombeau en marbre blanc construit au XVIIe siècle."}, {"cat": "cultura", "q": "Quel est le plus grand continent de la Terre ?", "ops": ["L'Afrique", "L'Asie", "L'Amérique du Nord", "L'Europe"], "ok": 1, "dato": "L'Asie couvre environ un tiers des terres émergées."}]}, {"id": "africa", "nombre": "Afrique", "emoji": "🦒", "color": "#C9961A", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale de l'Égypte ?", "ops": ["Le Caire", "Alexandrie", "Louxor", "Tunis"], "ok": 0, "dato": "Le Caire est l'une des plus grandes villes d'Afrique."}, {"cat": "capitales", "q": "Quel pays a Nairobi pour capitale ?", "ops": ["L'Éthiopie", "La Tanzanie", "Le Kenya", "L'Ouganda"], "ok": 2, "dato": "Nairobi a un parc national avec des lions et des girafes juste à côté de la ville."}, {"cat": "idiomas", "q": "Dans quelle partie de l'Afrique parle-t-on beaucoup le swahili ?", "ops": ["L'Afrique de l'Est", "L'Afrique du Nord", "L'Afrique de l'Ouest", "Seulement l'Afrique australe"], "ok": 0, "dato": "Des millions de personnes au Kenya, en Tanzanie et dans les pays voisins parlent swahili."}, {"cat": "agua", "q": "Quel fleuve traverse l'Égypte jusqu'à la mer Méditerranée ?", "ops": ["Le Congo", "Le Niger", "Le Zambèze", "Le Nil"], "ok": 3, "dato": "Le Nil est l'un des deux plus longs fleuves du monde."}, {"cat": "montes", "q": "Quelle est la plus haute montagne d'Afrique ?", "ops": ["Le mont Kenya", "Le Kilimandjaro", "Le mont Atlas", "La montagne de la Table"], "ok": 1, "dato": "Le Kilimandjaro, en Tanzanie, mesure environ 5 900 mètres et a de la neige au sommet."}, {"cat": "monumentos", "q": "Où se trouvent les grandes pyramides ?", "ops": ["À Gizeh, en Égypte", "À Tombouctou, au Mali", "À Rome, en Italie", "À Pétra, en Jordanie"], "ok": 0, "dato": "La grande pyramide a été construite il y a environ 4 500 ans."}, {"cat": "cultura", "q": "Quel est le plus grand désert chaud du monde ?", "ops": ["Le Gobi", "Le Kalahari", "Le Sahara", "L'Atacama"], "ok": 2, "dato": "Le Sahara couvre une grande partie du nord de l'Afrique."}, {"cat": "cultura", "q": "Quelle célèbre cascade se trouve entre la Zambie et le Zimbabwe ?", "ops": ["Les chutes du Niagara", "Le Salto Ángel", "Les chutes Victoria", "Les chutes d'Iguaçu"], "ok": 2, "dato": "Son nom local veut dire « la fumée qui gronde »."}]}, {"id": "norteamerica", "nombre": "Amérique du Nord", "emoji": "🦅", "color": "#14897B", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale du Canada ?", "ops": ["Toronto", "Vancouver", "Montréal", "Ottawa"], "ok": 3, "dato": "C'est Ottawa, et non Toronto, la capitale du Canada."}, {"cat": "capitales", "q": "Quelle est la capitale du Mexique ?", "ops": ["Cancún", "Mexico", "Guadalajara", "Monterrey"], "ok": 1, "dato": "Mexico a été construite à l'emplacement de Tenochtitlan, la ville des Aztèques."}, {"cat": "idiomas", "q": "Quelles sont les deux langues officielles du Canada ?", "ops": ["L'anglais et l'espagnol", "L'anglais et le français", "Le français et l'espagnol", "L'anglais et l'allemand"], "ok": 1, "dato": "La plupart des francophones du Canada vivent au Québec."}, {"cat": "agua", "q": "Quel grand fleuve coule vers le sud des États-Unis jusqu'au golfe du Mexique ?", "ops": ["Le Mississippi", "L'Amazone", "Le Colorado", "L'Hudson"], "ok": 0, "dato": "Avec le Missouri, il forme l'un des plus longs réseaux de fleuves du monde."}, {"cat": "montes", "q": "Quelle chaîne de montagnes longe l'ouest du Canada et des États-Unis ?", "ops": ["Les Appalaches", "Les Andes", "Les montagnes Rocheuses", "Les Alpes"], "ok": 2, "dato": "Les Rocheuses s'étendent sur environ 4 800 kilomètres."}, {"cat": "monumentos", "q": "Quel immense canyon a été creusé par le fleuve Colorado ?", "ops": ["Le Grand Canyon", "Le canyon du Cuivre", "La vallée de la Mort", "Yosemite"], "ok": 0, "dato": "Par endroits, le Grand Canyon a plus de 1,5 kilomètre de profondeur."}, {"cat": "monumentos", "q": "Quelle statue tenant une torche se dresse dans le port de New York ?", "ops": ["Le Christ Rédempteur", "La statue de la Liberté", "Le Penseur", "La Petite Sirène"], "ok": 1, "dato": "C'est un cadeau de la France, inauguré en 1886."}, {"cat": "cultura", "q": "Quelles célèbres chutes se trouvent entre le Canada et les États-Unis ?", "ops": ["Les chutes Victoria", "Le Salto Ángel", "Les chutes du Niagara", "Les chutes d'Iguaçu"], "ok": 2, "dato": "Une énorme quantité d'eau y tombe chaque seconde."}]}, {"id": "sudamerica", "nombre": "Amérique du Sud", "emoji": "🦜", "color": "#3E8E3E", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale du Brésil ?", "ops": ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], "ok": 2, "dato": "Brasília a été construite en quelques années et est devenue la capitale en 1960."}, {"cat": "capitales", "q": "Quel pays a Buenos Aires pour capitale ?", "ops": ["L'Argentine", "Le Chili", "L'Uruguay", "Le Pérou"], "ok": 0, "dato": "Buenos Aires se trouve au bord du Río de la Plata."}, {"cat": "idiomas", "q": "Quelle langue parle-t-on au Brésil ?", "ops": ["L'espagnol", "Le brésilien", "Le portugais", "L'anglais"], "ok": 2, "dato": "Le Brésil est le pays qui compte le plus de lusophones au monde."}, {"cat": "agua", "q": "Quel fleuve transporte le plus d'eau au monde ?", "ops": ["Le Nil", "L'Amazone", "Le Paraná", "L'Orénoque"], "ok": 1, "dato": "L'Amazone transporte plus d'eau que plusieurs des plus grands fleuves suivants réunis."}, {"cat": "montes", "q": "Quelle est la plus longue chaîne de montagnes sur terre ?", "ops": ["L'Himalaya", "Les Rocheuses", "Les Andes", "Les Alpes"], "ok": 2, "dato": "Les Andes s'étendent sur environ 7 000 kilomètres à l'ouest de l'Amérique du Sud."}, {"cat": "monumentos", "q": "Quelle cité inca se trouve en haut des montagnes du Pérou ?", "ops": ["Machu Picchu", "Chichén Itzá", "Teotihuacan", "Tikal"], "ok": 0, "dato": "Le Machu Picchu a été construit au XVe siècle et redécouvert par le monde en 1911."}, {"cat": "monumentos", "q": "Quelle statue géante domine Rio de Janeiro ?", "ops": ["La statue de la Liberté", "Le Christ Rédempteur", "La Mère-Patrie", "Le Colosse"], "ok": 1, "dato": "Elle se dresse au sommet du mont Corcovado."}, {"cat": "cultura", "q": "Quelle est la plus haute cascade du monde, au Venezuela ?", "ops": ["Les chutes d'Iguaçu", "Les chutes du Niagara", "Le Salto Ángel", "Les chutes Victoria"], "ok": 2, "dato": "Le Salto Ángel tombe de presque 1 kilomètre."}]}, {"id": "oceania", "nombre": "Océanie", "emoji": "🦘", "color": "#6B3FA0", "preguntas": [{"cat": "capitales", "q": "Quelle est la capitale de l'Australie ?", "ops": ["Sydney", "Melbourne", "Canberra", "Perth"], "ok": 2, "dato": "Canberra a été construite pour être la capitale, entre Sydney et Melbourne."}, {"cat": "capitales", "q": "Quelle est la capitale de la Nouvelle-Zélande ?", "ops": ["Auckland", "Wellington", "Christchurch", "Queenstown"], "ok": 1, "dato": "Wellington est l'une des villes les plus venteuses du monde."}, {"cat": "idiomas", "q": "Quelle langue du peuple maori est officielle en Nouvelle-Zélande ?", "ops": ["Le maori", "L'hawaïen", "Le samoan", "Le tongien"], "ok": 0, "dato": "Beaucoup de noms de lieux en Nouvelle-Zélande viennent de la langue maorie."}, {"cat": "agua", "q": "Quel est le plus grand océan de la Terre ?", "ops": ["L'Atlantique", "L'océan Indien", "L'océan Arctique", "Le Pacifique"], "ok": 3, "dato": "L'océan Pacifique est plus grand que toutes les terres émergées réunies."}, {"cat": "montes", "q": "Quelles montagnes longent l'est de l'Australie ?", "ops": ["La cordillère australienne", "Les Andes", "Les Alpes du Sud", "L'Atlas"], "ok": 0, "dato": "C'est la plus longue chaîne de montagnes d'Australie."}, {"cat": "monumentos", "q": "Quel bâtiment célèbre aux « voiles » blanches se trouve à Sydney ?", "ops": ["L'Opéra", "Le Parlement", "Le pont du port", "La Sky Tower"], "ok": 0, "dato": "L'Opéra de Sydney a ouvert en 1973."}, {"cat": "cultura", "q": "Quel est le plus grand récif de corail du monde ?", "ops": ["Le récif du Belize", "Le récif de la mer Rouge", "La Grande Barrière de corail", "Le récif des Maldives"], "ok": 2, "dato": "La Grande Barrière de corail, en Australie, est visible depuis l'espace."}, {"cat": "cultura", "q": "Quel animal porte son petit dans une poche ?", "ops": ["Le koala et le kangourou", "Le manchot", "L'émeu", "Le kiwi"], "ok": 0, "dato": "Les animaux à poche s'appellent les marsupiaux. La plupart vivent en Australie."}]}]};const U=D.ui;const CL="travel-world-fr";
let est=JSON.parse(localStorage.getItem(CL)||"{}");const guardar=()=>localStorage.setItem(CL,JSON.stringify(est));
const $=s=>document.querySelector(s);const app=$("#app");
const f=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function pasaporte(){return `<div class="pas"><h2>🛂 ${U.pasaporte}</h2><div class="sellos">${D.continentes.map(c=>`<div class="sello ${est[c.id]?"ok":""}" style="border-color:${c.color};color:${c.color}" title="${c.nombre}">${c.emoji}</div>`).join("")}</div></div>`}
function inicio(){app.innerHTML=`<div style="font-size:54px">🌍✈️</div><h1>${U.titulo.replace(/(\S+)$/,"<span>$1</span>")}</h1><p class="lema">${U.lema}</p>${pasaporte()}<button class="btn" onclick="mapa()">${U.jugar}</button>`}
function mapa(){if(D.continentes.every(c=>est[c.id]))return fin();
 app.innerHTML=`${pasaporte()}<h2 style="margin:6px 0 12px">${U.elige}</h2><div class="mapa">${D.continentes.map((c,i)=>`<button class="cont" style="background:${c.color}" onclick="viaje(${i})"><b>${c.emoji}</b>${c.nombre}${est[c.id]?"<small>✓</small>":""}</button>`).join("")}</div>`}
let cur=null;
function viaje(i){const c=D.continentes[i];cur={c,i:0,bien:0,orden:c.preguntas.map((_,k)=>k).sort(()=>Math.random()-.5)};preg()}
function preg(){const c=cur.c,p=c.preguntas[cur.orden[cur.i]];
 app.innerHTML=`<div class="tarjeta"><span class="cat" style="background:${c.color}">${c.emoji} ${U.categorias[p.cat]}</span><span class="num">${f(U.pregunta,{n:cur.i+1,t:c.preguntas.length})}</span>
 <div class="q">${p.q}</div><div class="ops">${p.ops.map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="acc oculto" id="acc"><button class="btn" onclick="sig()">${U.siguiente} →</button></div></div>`;
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>resp(+b.dataset.j,p))}
function resp(j,p){document.querySelectorAll(".op").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===p.ok)b.classList.add("bien");else if(k===j)b.classList.add("mal")});
 const ok=j===p.ok;if(ok)cur.bien++;const fb=$("#fb");fb.style.display="block";
 fb.innerHTML=ok?`<b>✅ ${U.correcto}</b>${p.dato}`:`<b>❌ ${U.incorrecto} ${p.ops[p.ok]}</b>${p.dato}`;$("#acc").classList.remove("oculto")}
function sig(){cur.i++;if(cur.i<cur.c.preguntas.length)return preg();
 const c=cur.c,t=c.preguntas.length,gano=cur.bien>=D.aprobar;if(gano){est[c.id]=1;guardar()}
 app.innerHTML=`<div class="tarjeta res"><div class="big">${gano?c.emoji:"🧭"}</div><h2>${gano?U.sello:c.nombre}</h2><p>${f(U.puntos,{n:cur.bien,t})}</p>${gano?"":`<p>${f(U.sello_falta,{n:D.aprobar,t})}</p>`}
 <p>${gano?"":`<button class="btn" onclick="viaje(${D.continentes.indexOf(c)})">${U.reintentar}</button> `}<button class="btn ${gano?"":"gris"}" onclick="mapa()">${U.volver}</button></p></div>`}
function fin(){app.innerHTML=`${pasaporte()}<div class="tarjeta res"><div class="big">🏆</div><h2>${U.final_titulo}</h2><p>${U.final_texto}</p><button class="btn" onclick="est={};guardar();inicio()">${U.reiniciar}</button></div>`}
inicio();
</script></body></html>
